name: FG CPU contracts

# Pull request checks run on Gitea (.gitea/workflows/fg-cpu-contracts.yml).
# This copy only runs when started manually.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GPU-free contracts
        run: cmake -S tools/tests/streamline_fg -B build/fg-contracts -DLO_STREAMLINE_FG_CPU_ONLY=ON
      - name: Build
        run: cmake --build build/fg-contracts --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/fg-contracts -C Release --output-on-failure
      - name: Preserve contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fg-contracts-${{ matrix.os }}
          path: build/fg-contracts/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
