name: Runtime review regressions

# Pull request checks run on Gitea (.gitea/workflows/review-regressions.yml).
# This copy only runs when started manually.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize fixture dependencies
        run: |
          git submodule update --init --depth 1 tools/XenonRecomp
          git -C tools/XenonRecomp submodule update --init --depth 1 thirdparty/xxHash thirdparty/tomlplusplus
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -S tools/tests/review_regressions -B build/review-regressions -DCMAKE_BUILD_TYPE=Debug -DLO_REVIEW_SANITIZE=ON
      - name: Build
        run: cmake --build build/review-regressions --parallel 2
      - name: Test
        run: ctest --test-dir build/review-regressions --output-on-failure --parallel 2
      - name: Preserve regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-regression-logs
          path: |
            build/review-regressions/Testing/Temporary/LastTest.log
            build/review-regressions/fixtures/**/*.log
          if-no-files-found: ignore
          retention-days: 7
