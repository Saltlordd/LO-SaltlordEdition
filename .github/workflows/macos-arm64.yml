name: macOS arm64

# Builds and tests everything that does not need game data. The runtime itself
# links the recompiled game code, which is generated from a private default.xex;
# game data never enters CI, so the runtime link is not attempted here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (no game data)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          brew install ninja
          python -m pip install numpy pillow
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-macos.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-macos.patch
      - name: Build recompiler tools
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump
      - name: Configure
        run: |
          cmake -S . -B out/build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DLO_BUILD_RECOMP_LIB=OFF \
            -DLO_BUILD_MOD_TESTS=ON
      - name: Build libraries and tests
        run: |
          # Tests that compile runtime sources or generated PPC headers need game data.
          excluded='^(LoDiscRuntimeTest|LoGuestDispatchTest|LoGuestPrintfTest|LoStorageTest|LoHidTest|LoQuitActionHookTest|LoPresentationTest)$'
          ninja -C out/build/macos -t targets all | grep -oE '^Lo[A-Za-z0-9]+(Test|Probe|Tool):' | tr -d ':' | sort -u |
            grep -vE "$excluded" > out/build/macos/ci-targets.txt
          ninja -C out/build/macos plume spirv-cross-msl SDL2-static XenonUtils lo_portable_shader_pack lo_menu_lzo \
            lo_avcodec lo_avutil o1heap $(cat out/build/macos/ci-targets.txt)
      - name: Compile MetalFX FG game integration (no game data)
        run: |
          cmake -S tools/tests/motion_replay -B out/build/metalfx-fg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DLO_ENABLE_DLSS=OFF -DLO_ENABLE_FSR=OFF \
            -DLO_P2_VIDEO_COMPILE_CHECK=ON \
            -DLO_P2_VIDEO_SDL_HEADERS="$PWD/thirdparty/SDL/include" \
            -DLO_METALFX_FG_GAME_COMPILE_CHECK=ON
          cmake --build out/build/metalfx-fg --target fg_metal_compile p2_video_compile motion_renderer_compile
      - name: Run tests
        run: |
          scratch="$RUNNER_TEMP/lo-tests"
          mkdir -p "$scratch/home"
          export HOME="$scratch/home"
          failed=0
          while read -r test; do
            [ "$test" = LoShaderPackTool ] || [ "$test" = LoShaderTool ] || [ "$test" = LoImportPayloadProbe ] && continue
            binary=$(find out/build/macos -type f -perm -u+x -name "$test" | head -n 1)
            case "$test" in
              LoPipelineCacheTest|LoShaderPrebuildIoTest|LoShaderPreparationQueueTest|LoPortableShaderContractTest) args="$scratch/$test" ;;
              LoShaderResourceVariantsTest) mkdir -p "$scratch/$test"; args="$scratch/$test" ;;
              *) args="" ;;
            esac
            echo "::group::$test"
            if ! "$binary" $args; then echo "::error::$test failed"; failed=1; fi
            echo "::endgroup::"
          done < out/build/macos/ci-targets.txt
          exit $failed
      - name: Run Python tests
        run: |
          python -m unittest discover -s tools/tests -p 'test_*.py'
          python tools/tests/ppc_codegen_test.py
      # Temporary: payload for the macOS 14 DXC check below.
      - name: Stage the macOS 14 DXC check
        run: |
          stage="$RUNNER_TEMP/dxc-macos14"
          mkdir -p "$stage"
          cp out/build/macos/LostOdysseyRecomp/LoRenderResolutionShaderTest \
             out/build/macos/LostOdysseyRecomp/libdxcompiler.dylib "$stage/"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/dxc-macos14.tar" dxc-macos14
      - uses: actions/upload-artifact@v4
        with:
          name: dxc-macos14
          path: ${{ runner.temp }}/dxc-macos14.tar
          retention-days: 7

  # Temporary: GitHub's macos-14 image is unsupported from 2026-11-02. Runs the
  # shader test built above (deployment target 14.0, current SDK) on macOS 14
  # with the shipped DXC, whose arm64 slice is marked minos 15.0.
  dxc-macos-14:
    name: DXC on macOS 14 (temporary)
    needs: build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dxc-macos14
      - name: Describe the host and binaries
        run: |
          sw_vers
          tar -xf dxc-macos14.tar
          for file in dxc-macos14/LoRenderResolutionShaderTest dxc-macos14/libdxcompiler.dylib; do
            echo "== $file"
            shasum -a 256 "$file"
            lipo -info "$file"
            otool -arch arm64 -l "$file" | grep -A4 LC_BUILD_VERSION | grep -E 'minos|sdk'
          done
          ls /usr/local/lib/libdxcompiler* /opt/homebrew/lib/libdxcompiler* 2>/dev/null || echo "no other libdxcompiler.dylib"
          ls -d /Applications/Xcode*.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX1*.sdk || true
      - name: Link every DXC arm64 import against the macOS 14.0 SDK
        run: |
          sdk=$(ls -d /Applications/Xcode*.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX14.0.sdk | head -n 1)
          test -n "$sdk" || { echo "::error::no MacOSX14.0.sdk on this image"; exit 1; }
          work="$RUNNER_TEMP/link-check"
          mkdir -p "$work"
          nm -arch arm64 -u -m dxc-macos14/libdxcompiler.dylib | awk '{print $3}' | sort -u > "$work/imports.txt"
          echo "imports: $(wc -l < "$work/imports.txt") (weak: $(nm -arch arm64 -u -m dxc-macos14/libdxcompiler.dylib | grep -c 'weak external' || true))"
          # ___cxa_init_primary_exception is libc++ 18 (macOS 15.0): the control must fail.
          { cat "$work/imports.txt"; echo ___cxa_init_primary_exception; } > "$work/control.txt"
          for list in imports control; do
            { echo '.section __DATA,__data'; echo '.p2align 3'
              while read -r symbol; do printf '.quad "%s"\n' "$symbol"; done < "$work/$list.txt"; } > "$work/$list.s"
            xcrun clang -arch arm64 -c "$work/$list.s" -o "$work/$list.o"
          done
          xcrun ld -arch arm64 -dylib -o "$work/imports.dylib" "$work/imports.o" -syslibroot "$sdk" \
            -lc++ -lSystem -platform_version macos 14.0 14.0
          echo "all imports link against $sdk"
          if xcrun ld -arch arm64 -dylib -o "$work/control.dylib" "$work/control.o" -syslibroot "$sdk" \
              -lc++ -lSystem -platform_version macos 14.0 14.0 2> "$work/control.log"; then
            echo "::error::the macOS 15.0 control symbol linked against the 14.0 SDK"; exit 1
          fi
          grep -m 3 init_primary_exception "$work/control.log"
      - name: Load DXC and compile shaders
        run: |
          set -o pipefail
          cd dxc-macos14
          DYLD_PRINT_LIBRARIES=1 ./LoRenderResolutionShaderTest 2>&1 | grep -v -E '^dyld\[[0-9]+\]: /(usr/lib|System)/'
