name: Reusable frame generation
# Pull request checks run on git.zkx.ca; this workflow has no GitHub copy.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: [shared/frame_generation/**, tools/tests/frame_generation/**, .gitea/workflows/reusable-fg.yml]
  pull_request:
    paths: [shared/frame_generation/**, tools/tests/frame_generation/**, .gitea/workflows/reusable-fg.yml]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends cmake g++
      - run: cmake -S tools/tests/frame_generation -B out/fg-core
      - run: cmake --build out/fg-core --config Release --parallel 4
      - run: ctest --test-dir out/fg-core -C Release --output-on-failure
  native:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        provider: [DLSS, FSR, BOTH]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # actions/checkout would send the Gitea job token to github.com, which
      # rejects it; fetch the pinned public SDK headers without credentials.
      - name: Fetch pinned SDK headers
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            rm -rf "$3"
            git init -q "$3"
            git -C "$3" remote add origin "$1"
            git -C "$3" sparse-checkout set --cone "$4"
            git -C "$3" fetch -q --depth 1 --filter=blob:none origin "$2"
            git -C "$3" checkout -q FETCH_HEAD
          }
          if [ '${{ matrix.provider }}' != FSR ]; then
            fetch https://github.com/NVIDIA-RTX/Streamline.git 2122257e0fce486f91b385aa63b9a09b0a34b363 out/deps/streamline include
          fi
          if [ '${{ matrix.provider }}' != DLSS ]; then
            fetch https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git c6efa6bf7f2027b3ec94f28578bb5965eabb9e55 out/deps/fidelityfx ffx-api/include
          fi
      - name: Configure independent SDK adapters
        shell: pwsh
        run: |
          $dlss = if ('${{ matrix.provider }}' -ne 'FSR') { 'ON' } else { 'OFF' }
          $fsr = if ('${{ matrix.provider }}' -ne 'DLSS') { 'ON' } else { 'OFF' }
          cmake -S tools/tests/frame_generation -B out/fg-native -A x64 "-DFRAMEGEN_WITH_DLSS=$dlss" "-DFRAMEGEN_WITH_FSR=$fsr" -DFRAMEGEN_STREAMLINE_INCLUDE="$pwd/out/deps/streamline/include" -DFRAMEGEN_FIDELITYFX_INCLUDE="$pwd/out/deps/fidelityfx/ffx-api/include"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cmake --build out/fg-native --config Release --parallel 4
      - run: ctest --test-dir out/fg-native -C Release --output-on-failure
  # Mirror the result onto the GitHub commit so pull requests show it. Needs a
  # Gitea secret LO_GITHUB_TOKEN (fine-grained PAT, Commit statuses: write).
  github-status:
    needs: [core, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report to GitHub
        env:
          LO_GITHUB_TOKEN: ${{ secrets.LO_GITHUB_TOKEN }}
          RESULTS: ${{ needs.core.result }} ${{ needs.native.result }}
          CONTEXT: gitea/reusable-fg
          RUN_URL: https://git.zkx.ca/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          if [ -z "$LO_GITHUB_TOKEN" ]; then echo 'LO_GITHUB_TOKEN is not set; skipping'; exit 0; fi
          state=success
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; cancelled) [ "$state" = failure ] || state=error ;; *) state=failure ;; esac
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $LO_GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/freefrank/LostOdysseyRecomp/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"$CONTEXT\",\"description\":\"Gitea Actions: $RESULTS\",\"target_url\":\"$RUN_URL\"}") || true
          echo "GitHub status $state for $GITHUB_SHA -> HTTP $code"
