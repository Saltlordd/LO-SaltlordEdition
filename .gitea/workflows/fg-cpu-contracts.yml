name: FG CPU contracts

# Gitea copy of .github/workflows/fg-cpu-contracts.yml. Pull request checks
# run on git.zkx.ca; the GitHub workflow is manual-only.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '.gitea/workflows/fg-cpu-contracts.yml'
      - 'LostOdysseyRecomp/gpu/dlss_fg_*.h'
      - 'LostOdysseyRecomp/gpu/dlss_ngx.*'
      - 'LostOdysseyRecomp/gpu/temporal_upscaler.*'
      - 'LostOdysseyRecomp/gpu/streamline_vulkan_dispatch.*'
      - 'LostOdysseyRecomp/gpu/renderer.cpp'
      - 'LostOdysseyRecomp/gpu/video.*'
      - 'LostOdysseyRecomp/gpu/command_processor.*'
      - 'LostOdysseyRecomp/gpu/dlss_frame_generation.*'
      - 'LostOdysseyRecomp/gpu/frame_generation_composite.h'
      - 'LostOdysseyRecomp/gpu/temporal_frame_inputs.h'
      - 'tools/tests/streamline_fg/**'
      - 'tools/tests/temporal_frame_inputs_test.cpp'
      - 'tools/tests/temporal_upscaler_contract_test.cpp'
      - 'tools/tests/frame_plan_test.cpp'
      - 'tools/tests/native_dlss_submission_lifetime_test.cpp'
      - 'LostOdysseyRecomp/gpu/frame_plan.h'
      - 'LostOdysseyRecomp/gpu/upscaling_plan.*'
  pull_request:
    paths:
      - '.gitea/workflows/fg-cpu-contracts.yml'
      - 'LostOdysseyRecomp/gpu/dlss_fg_*.h'
      - 'LostOdysseyRecomp/gpu/dlss_ngx.*'
      - 'LostOdysseyRecomp/gpu/temporal_upscaler.*'
      - 'LostOdysseyRecomp/gpu/streamline_vulkan_dispatch.*'
      - 'LostOdysseyRecomp/gpu/renderer.cpp'
      - 'LostOdysseyRecomp/gpu/video.*'
      - 'LostOdysseyRecomp/gpu/command_processor.*'
      - 'LostOdysseyRecomp/gpu/dlss_frame_generation.*'
      - 'LostOdysseyRecomp/gpu/frame_generation_composite.h'
      - 'LostOdysseyRecomp/gpu/temporal_frame_inputs.h'
      - 'tools/tests/streamline_fg/**'
      - 'tools/tests/temporal_frame_inputs_test.cpp'
      - 'tools/tests/temporal_upscaler_contract_test.cpp'
      - 'tools/tests/frame_plan_test.cpp'
      - 'tools/tests/native_dlss_submission_lifetime_test.cpp'
      - 'LostOdysseyRecomp/gpu/frame_plan.h'
      - 'LostOdysseyRecomp/gpu/upscaling_plan.*'

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends cmake g++
      - name: Configure GPU-free contracts
        run: cmake -S tools/tests/streamline_fg -B build/fg-contracts -DLO_STREAMLINE_FG_CPU_ONLY=ON
      - name: Build
        run: cmake --build build/fg-contracts --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build/fg-contracts -C Release --output-on-failure
      - name: Preserve contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fg-contracts-${{ matrix.os }}
          path: build/fg-contracts/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
